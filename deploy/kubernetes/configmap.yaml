# Non-secret settings; every variable is documented in the Configuration guide and .env.example.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  SPRING_PROFILES_ACTIVE: prod
  DB_URL: jdbc:postgresql://postgres:5432/app
  DB_POOL_SIZE: "10"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_SSL_ENABLED: "false"
  MAIL_HOST: smtp.example.com
  MAIL_PORT: "587"
  MAIL_FROM: no-reply@example.com
  MAIL_LINK_BASE_URL: https://app.example.com
  CORS_ALLOWED_ORIGINS: https://app.example.com
  # The ingress controller sets X-Forwarded-For; only trust it behind such a proxy.
  FORWARD_HEADERS_STRATEGY: framework
