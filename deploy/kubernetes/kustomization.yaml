# Production manifests. Build with:  kubectl kustomize deploy/kubernetes
# Apply with:  kubectl apply -k deploy/kubernetes   (after creating the app-secrets Secret, see README.md)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: backend
labels:
  - pairs:
      app.kubernetes.io/name: spring-boot-template
    includeSelectors: true
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
images:
  # Pin a release tag (or digest) instead of "latest".
  - name: ghcr.io/hikmethankolay/spring-boot-backend-template
    newTag: latest
