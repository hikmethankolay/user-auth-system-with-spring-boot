# The API port is open to the cluster (the ingress controller); the management port only to pods
# in namespaces labelled for monitoring. Adjust the selector to your Prometheus namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: spring-boot-template
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: http
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: management
