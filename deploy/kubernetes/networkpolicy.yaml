# The API port is open only to the ingress controller's namespace, so no other pod can bypass it and
# forge X-Forwarded-For; the management port only to the monitoring namespace. Adjust both selectors
# to your ingress controller and Prometheus namespaces.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: spring-boot-template
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: http
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: management
