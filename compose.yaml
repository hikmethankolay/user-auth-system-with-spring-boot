# Local stack. Values come from .env (see .env.example).
#   scripts/db.sh up       -> PostgreSQL only (run the app with scripts/dev.sh)
#   scripts/docker.sh up   -> PostgreSQL + app image ("app" profile)
name: spring-boot-template

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-app}
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-app}
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
