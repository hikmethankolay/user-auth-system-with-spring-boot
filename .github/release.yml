# Categories for the notes `gh release create --generate-notes` writes (release workflow), by pull request label.
changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: Breaking changes
      labels: [breaking-change]
    - title: Features
      labels: [enhancement, feature]
    - title: Fixes
      labels: [bug, fix, security]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
