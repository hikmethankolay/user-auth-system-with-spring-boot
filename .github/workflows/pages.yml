name: Documentation site

# Builds the documentation website (scripts/site.sh) and deploys it to GitHub Pages
# (Settings > Pages > Source: GitHub Actions). Runs for every release tag; can also be started by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0   # tags are needed for the version shown on the site

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install Doxygen
        run: |
          curl -fsSL https://www.doxygen.nl/files/doxygen-1.16.1.linux.bin.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-1.16.1/bin" >> "$GITHUB_PATH"

      - name: Build site (tests, OpenAPI export, Doxygen, coverage, Starlight)
        env:
          # Project site URL: https://<owner>.github.io/<repository>/
          SITE_URL: https://${{ github.repository_owner }}.github.io
          SITE_BASE: /${{ github.event.repository.name }}
        run: scripts/site.sh

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/pages

  # Deploys the built site; needs no access to the repository contents.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
