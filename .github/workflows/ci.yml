name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Integration tests start PostgreSQL with Testcontainers (Docker is available on the runner).
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: target/site/jacoco/

  image:
    name: Docker image and vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build image
        run: docker build -t app:ci .

      # Fails on fixable critical/high vulnerabilities in the OS packages or Java dependencies.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Doxygen
        run: |
          curl -fsSL https://www.doxygen.nl/files/doxygen-1.16.1.linux.bin.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-1.16.1/bin" >> "$GITHUB_PATH"

      - name: Generate documentation (fails on undocumented code)
        run: scripts/docs.sh --strict

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-documentation
          path: target/doxygen/html/
