name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the run in progress; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Integration tests start PostgreSQL with Testcontainers (Docker is available on the runner).
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: target/site/jacoco/

  # Runs the .bat scripts, so they cannot silently drift from their .sh counterparts. The Windows runner has no
  # Linux containers, so only the scripts that need none run here; the build job covers the integration tests.
  windows:
    name: Windows scripts
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Unit tests
        run: scripts\test.bat --unit

      - name: Documentation
        run: scripts\docs.bat

      - name: Build jar
        run: scripts\build.bat --skip-tests

  image:
    name: Docker image and vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build image
        run: docker build -t app:ci .

      # Fails on fixable critical/high vulnerabilities in the OS packages or Java dependencies.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: app:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Generate documentation (fails on undocumented code)
        run: scripts/docs.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-documentation
          path: target/reports/apidocs/

  # Renames the checkout the way a new project does, then runs the unit tests, so rename-project cannot leave
  # the template's package or repository links behind.
  rename:
    name: Rename project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Rename
        run: scripts/rename-project.sh --repo Acme/Order-Service com.acme order-service com.acme.orders

      # Left on purpose: the README's author line and the template remote in "Getting fixes from the template later".
      - name: No template references left
        run: |
          if git grep -n -e hikmethankolay -e spring-boot-backend-template -- . ':!scripts/rename-project.sh' \
              ':!docs/package-lock.json' ':!docs/src/content/docs/guides/new-project.md' | grep -v 'Hikmethan Kolay'; then
            exit 1
          fi

      - name: Unit tests
        run: scripts/test.sh --unit
