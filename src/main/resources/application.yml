# Every value can be overridden with an environment variable or a .env file in the working directory.
# See .env.example for the full list.
spring:
  application:
    name: spring-boot-template
  config:
    # Optional .env file in the working directory; DOTENV_PATH points elsewhere (tests disable it).
    import: optional:file:${DOTENV_PATH:.env}[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks that entities match it.
      ddl-auto: validate
  flyway:
    # Databases created before Flyway was introduced (they already have the users table) are
    # baselined at version 1 instead of failing; fresh databases run every migration.
    baseline-on-migrate: true
    baseline-version: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Short timeouts: when Redis is down, requests fall back to the database quickly.
      connect-timeout: 500ms
      timeout: 500ms
    web:
      pageable:
        max-page-size: 100
        # Pages are serialized as {"content":[...],"page":{"size","number","totalElements","totalPages"}}.
        serialization-mode: via-dto
  mail:
    # Defaults point to Mailpit from compose.yaml (web UI: http://localhost:8025).
    # Set SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD for a real SMTP server.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  cache:
    type: redis
    redis:
      time-to-live: ${CACHE_TTL:10m}
      # Keys look like "spring-boot-template:users::42", so several apps can share one Redis.
      key-prefix: "${spring.application.name}:"
      cache-null-values: false
  threads:
    virtual:
      enabled: true
  web:
    # Error and validation messages are always English, whatever the server's OS locale.
    # Switch the resolver to "accept-header" and add messages_xx.properties to localise them.
    locale: en
    locale-resolver: fixed

server:
  port: ${PORT:8080}
  # Set to "framework" or "native" when running behind a trusted reverse proxy,
  # otherwise X-Forwarded-For is ignored (it can be spoofed by clients).
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  shutdown: graceful

management:
  health:
    redis:
      # The app keeps working without Redis (cache, lockout and rate limit fail open), so it must not mark the app DOWN.
      enabled: false
    mail:
      # Mail failures are logged and retried by the user; an SMTP outage must not mark the app DOWN.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    # Share of requests that are traced and exported. Trace ids are in the logs and in the
    # X-Trace-Id header either way. Export is off until an OTLP endpoint is set, e.g.
    # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}

app:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${spring.application.name}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    remember-me-ttl: ${JWT_REMEMBER_ME_TTL:30d}
  cookie:
    name: auth_token
    secure: ${COOKIE_SECURE:false}
    same-site: Strict
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  login:
    max-attempts: ${LOGIN_MAX_ATTEMPTS:10}
    lock-duration: ${LOGIN_LOCK_DURATION:1h}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:120}
  account:
    # true in the prod profile: unverified users cannot log in.
    require-verified-email: ${REQUIRE_VERIFIED_EMAIL:false}
    verification-token-ttl: 24h
    password-reset-token-ttl: 1h
  mail:
    from: ${MAIL_FROM:no-reply@example.com}
    # Frontend that handles /verify-email?token=... and /reset-password?token=... links.
    link-base-url: ${MAIL_LINK_BASE_URL:http://localhost:3000}
  admin:
    username: ${ADMIN_USERNAME:}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
